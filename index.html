<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Nawigacja Roblox</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#status {
    position: fixed;
    top: 15px;
    left: 15px;

    background: rgba(0,0,0,0.7);
    color: white;

    padding: 8px 12px;
    border-radius: 8px;

    font-family: Arial, sans-serif;
    font-size: 14px;
}

</style>

</head>

<body>

<canvas id="map"></canvas>

<div id="status">
Łączenie...
</div>

<script>

const canvas = document.getElementById("map")
const ctx = canvas.getContext("2d")

const statusElement =
    document.getElementById("status")

const ROUTE_URL =
"https://nawigacja-a8a91-default-rtdb.europe-west1.firebasedatabase.app/routes/718_1.json"

const BUS_URL =
"https://nawigacja-a8a91-default-rtdb.europe-west1.firebasedatabase.app/buses/bus1.json"

let route = []

let bus = null

let mapData = null



async function loadRoute() {

    try {

        const response =
            await fetch(ROUTE_URL)

        const data =
            await response.json()

        if (!data || !data.points) {

            statusElement.textContent =
                "Brak trasy"

            return

        }

        route = data.points

        calculateMap()

        draw()

    } catch(error) {

        console.error(error)

        statusElement.textContent =
            "Błąd trasy"

    }

}



async function loadBus() {

    try {

        const response =
            await fetch(BUS_URL)

        const data =
            await response.json()

        if (!data) {

            statusElement.textContent =
                "Brak autobusu"

            return

        }

        bus = data

        statusElement.textContent =
            "Autobus online"

        draw()

    } catch(error) {

        console.error(error)

        statusElement.textContent =
            "Błąd autobusu"

    }

}



function resize() {

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    )

    calculateMap()

    draw()

}



function calculateMap() {

    if (route.length < 2)
        return

    const width =
        window.innerWidth

    const height =
        window.innerHeight

    const padding = 60



    const xs =
        route.map(p => p.x)

    const zs =
        route.map(p => p.z)



    const minX =
        Math.min(...xs)

    const maxX =
        Math.max(...xs)

    const minZ =
        Math.min(...zs)

    const maxZ =
        Math.max(...zs)



    const rangeX =
        maxX - minX || 1

    const rangeZ =
        maxZ - minZ || 1



    const scaleX =
        (width - padding * 2)
        / rangeX

    const scaleZ =
        (height - padding * 2)
        / rangeZ



    const scale =
        Math.min(
            scaleX,
            scaleZ
        )



    mapData = {

        minX,
        maxX,
        minZ,
        maxZ,
        scale

    }

}



function convert(x, z) {

    if (!mapData)
        return null

    const width =
        window.innerWidth

    const height =
        window.innerHeight



    const centerX =
        (
            mapData.minX +
            mapData.maxX
        ) / 2

    const centerZ =
        (
            mapData.minZ +
            mapData.maxZ
        ) / 2



    return {

        x:
            width / 2 +
            (x - centerX)
            * mapData.scale,

        y:
            height / 2 -
            (z - centerZ)
            * mapData.scale

    }

}



function drawRoute() {

    if (route.length < 2)
        return

    ctx.beginPath()

    route.forEach(
        (point, index) => {

            const p =
                convert(
                    point.x,
                    point.z
                )

            if (index === 0) {

                ctx.moveTo(
                    p.x,
                    p.y
                )

            } else {

                ctx.lineTo(
                    p.x,
                    p.y
                )

            }

        }
    )



    ctx.strokeStyle =
        "#00aaff"

    ctx.lineWidth = 10

    ctx.lineCap =
        "round"

    ctx.lineJoin =
        "round"

    ctx.stroke()

}



function drawBus() {

    if (!bus)
        return

    const p =
        convert(
            bus.x,
            bus.z
        )

    if (!p)
        return



    ctx.save()

    ctx.translate(
        p.x,
        p.y
    )



    ctx.rotate(
        bus.rotation *
        Math.PI /
        180
    )



    ctx.beginPath()

    ctx.moveTo(
        0,
        -18
    )

    ctx.lineTo(
        -12,
        14
    )

    ctx.lineTo(
        0,
        9
    )

    ctx.lineTo(
        12,
        14
    )

    ctx.closePath()



    ctx.fillStyle =
        "#00ff66"

    ctx.fill()



    ctx.lineWidth = 3

    ctx.strokeStyle =
        "#ffffff"

    ctx.stroke()



    ctx.restore()

}



function drawPoints() {

    route.forEach(
        point => {

            const p =
                convert(
                    point.x,
                    point.z
                )

            ctx.beginPath()

            ctx.arc(
                p.x,
                p.y,
                5,
                0,
                Math.PI * 2
            )

            ctx.fillStyle =
                "#ffffff"

            ctx.fill()

        }
    )

}



function draw() {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    )

    drawRoute()

    drawPoints()

    drawBus()

}



window.addEventListener(
    "resize",
    resize
)



resize()

loadRoute()

loadBus()



setInterval(
    loadBus,
    500
)



setInterval(
    loadRoute,
    5000
)

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Nawigacja Roblox</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#status {
    position: fixed;
    top: 15px;
    left: 15px;

    background: rgba(20,20,20,0.92);
    color: white;

    padding: 9px 13px;
    border-radius: 8px;

    font-size: 14px;

    z-index: 5;
}

#buttons {
    position: fixed;
    top: 15px;
    right: 15px;

    display: none;
    gap: 8px;

    z-index: 5;
}

.topButton {
    background: rgba(20,20,20,0.92);
    color: white;

    padding: 9px 13px;

    border-radius: 8px;
    border: none;

    font-size: 14px;
}

#info {
    position: fixed;
    left: 15px;
    bottom: 20px;

    background: rgba(20,20,20,0.95);
    color: white;

    padding: 14px 18px;

    border-radius: 12px;

    min-width: 210px;

    z-index: 5;
}

#nextLabel {
    color: #888;
    font-size: 12px;
}

#nextStop {
    font-size: 20px;
    font-weight: bold;

    margin-top: 4px;
}

#distance {
    color: #00aaff;

    font-size: 17px;

    margin-top: 5px;
}

#routeName {
    color: #777;

    font-size: 12px;

    margin-top: 8px;
}

.overlay {
    position: fixed;
    inset: 0;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 100;
}

.box {
    width: calc(100% - 60px);
    max-width: 350px;

    background: #111;

    padding: 25px;

    border-radius: 15px;

    text-align: center;
}

.box h2 {
    color: white;
    margin-top: 0;
}

.box p {
    color: #aaa;
}

.input {
    box-sizing: border-box;

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    font-size: 20px;

    text-align: center;

    border-radius: 9px;
    border: 1px solid #444;

    background: #000;
    color: white;

    outline: none;
}

.input:focus {
    border-color: #00aaff;
}

select.input {
    appearance: none;
}

.mainButton {
    width: 100%;

    margin-top: 14px;
    padding: 14px;

    font-size: 17px;

    border: none;
    border-radius: 9px;

    background: #00aaff;
    color: white;
}

.cancelButton {
    width: 100%;

    margin-top: 8px;
    padding: 12px;

    font-size: 16px;

    border: none;
    border-radius: 9px;

    background: #333;
    color: white;
}

.error {
    color: #ff5555;

    margin-top: 12px;

    min-height: 20px;
}

#directionMenu {
    display: none;
}

#vehicleMenu {
    display: none;
}
</style>
</head>

<body>

<canvas id="map"></canvas>

<div id="status">
Wybierz pojazd
</div>

<div id="buttons">

    <button
        id="changeDirectionButton"
        class="topButton"
    >
        Zmień kierunek
    </button>

    <button
        id="changeBusButton"
        class="topButton"
    >
        Zmień pojazd
    </button>

</div>

<div id="info">

    <div id="nextLabel">
        NASTĘPNY PRZYSTANEK
    </div>

    <div id="nextStop">
        ---
    </div>

    <div id="distance">
        ---
    </div>

    <div id="routeName">
        ---
    </div>

</div>


<div
    id="login"
    class="overlay"
>

    <div class="box">

        <h2>Nawigacja</h2>

        <p>
            Wybierz grę oraz wpisz dane
        </p>

        <select
            id="gameSelect"
            class="input"
        >

            <option value="10321306421">
                MZK Garczyków
            </option>

            <option value="10694470488">
                Gra Testowa
            </option>

        </select>

        <input
            id="fleetNumber"
            class="input"
            type="text"
            inputmode="numeric"
            placeholder="Numer taborowy"
            autocomplete="off"
        >

        <input
            id="lineNumber"
            class="input"
            type="text"
            inputmode="numeric"
            placeholder="Linia, np. 718"
            autocomplete="off"
        >

        <input
            id="directionNumber"
            class="input"
            type="text"
            inputmode="numeric"
            placeholder="Kierunek: 1 lub 2"
            maxlength="1"
            autocomplete="off"
        >

        <button
            id="connectButton"
            class="mainButton"
        >
            Połącz
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</div>


<div
    id="directionMenu"
    class="overlay"
>

    <div class="box">

        <h2>Zmień kierunek</h2>

        <p>
            Wpisz 1 albo 2
        </p>

        <input
            id="directionInput"
            class="input"
            type="text"
            inputmode="numeric"
            placeholder="1 lub 2"
            maxlength="1"
            autocomplete="off"
        >

        <button
            id="confirmDirection"
            class="mainButton"
        >
            Zmień kierunek
        </button>

        <button
            id="cancelDirection"
            class="cancelButton"
        >
            Anuluj
        </button>

        <div
            id="directionError"
            class="error"
        ></div>

    </div>

</div>


<div
    id="vehicleMenu"
    class="overlay"
>

    <div class="box">

        <h2>Zmień pojazd</h2>

        <p>
            Wpisz nowy numer taborowy
        </p>

        <input
            id="vehicleInput"
            class="input"
            type="text"
            inputmode="numeric"
            placeholder="Numer taborowy"
            autocomplete="off"
        >

        <button
            id="confirmVehicle"
            class="mainButton"
        >
            Zmień pojazd
        </button>

        <button
            id="cancelVehicle"
            class="cancelButton"
        >
            Anuluj
        </button>

        <div
            id="vehicleError"
            class="error"
        ></div>

    </div>

</div>


<script>

const DATABASE_URL =
"https://nawigacja-a8a91-default-rtdb.europe-west1.firebasedatabase.app"


const GAME_NAMES = {
    "10321306421": "MZK Garczyków",
    "10694470488": "Gra Testowa"
}


const canvas =
document.getElementById("map")

const ctx =
canvas.getContext("2d")


const gameSelect =
document.getElementById("gameSelect")

const login =
document.getElementById("login")

const fleetInput =
document.getElementById("fleetNumber")

const lineInput =
document.getElementById("lineNumber")

const directionNumberInput =
document.getElementById("directionNumber")

const connectButton =
document.getElementById("connectButton")

const loginError =
document.getElementById("loginError")


const buttons =
document.getElementById("buttons")

const changeBusButton =
document.getElementById("changeBusButton")

const changeDirectionButton =
document.getElementById("changeDirectionButton")


const directionMenu =
document.getElementById("directionMenu")

const directionInput =
document.getElementById("directionInput")

const confirmDirection =
document.getElementById("confirmDirection")

const cancelDirection =
document.getElementById("cancelDirection")

const directionError =
document.getElementById("directionError")


const vehicleMenu =
document.getElementById("vehicleMenu")

const vehicleInput =
document.getElementById("vehicleInput")

const confirmVehicle =
document.getElementById("confirmVehicle")

const cancelVehicle =
document.getElementById("cancelVehicle")

const vehicleError =
document.getElementById("vehicleError")


const statusElement =
document.getElementById("status")

const nextStopElement =
document.getElementById("nextStop")

const distanceElement =
document.getElementById("distance")

const routeNameElement =
document.getElementById("routeName")


let selectedGameId = null

let fleetNumber = null
let lineNumber = null
let directionNumber = null
let currentRouteName = null

let route = []
let stops = []

let bus = null
let mapData = null

let routeDistances = []


function normalizeArray(data) {

    if (!data) {
        return []
    }

    if (Array.isArray(data)) {
        return data
    }

    return Object.values(data)
}


async function loadRoute(routeName) {

    try {

        const url =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/routes/" +
            encodeURIComponent(routeName) +
            ".json"


        const response =
            await fetch(url)


        const data =
            await response.json()


        if (!data || !data.points) {
            return false
        }


        route =
            normalizeArray(
                data.points
            )


        stops =
            normalizeArray(
                data.stops
            )


        route.sort(
            (a,b) =>
            Number(a.id) -
            Number(b.id)
        )


        stops.sort(
            (a,b) =>
            Number(a.id) -
            Number(b.id)
        )


        currentRouteName =
            routeName


        calculateRouteDistances()

        calculateMap()

        updateInfo()

        draw()


        return true


    } catch(error) {

        console.error(error)

        return false
    }
}


async function connect() {

    const gameId =
        gameSelect.value


    const fleet =
        fleetInput.value.trim()


    const line =
        lineInput.value.trim()


    const direction =
        directionNumberInput.value.trim()


    if (!gameId) {

        loginError.textContent =
        "Wybierz grę"

        return
    }


    if (!fleet) {

        loginError.textContent =
        "Wpisz numer taborowy"

        return
    }


    if (!line) {

        loginError.textContent =
        "Wpisz linię"

        return
    }


    if (
        direction !== "1" &&
        direction !== "2"
    ) {

        loginError.textContent =
        "Kierunek musi być 1 albo 2"

        return
    }


    loginError.textContent =
    "Łączenie..."


    selectedGameId =
        gameId


    try {

        const busURL =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/buses/" +
            encodeURIComponent(fleet) +
            ".json"


        const busResponse =
            await fetch(busURL)


        const busData =
            await busResponse.json()


        if (!busData) {

            loginError.textContent =
            "Nie znaleziono pojazdu " +
            fleet

            return
        }


        fleetNumber =
            fleet


        lineNumber =
            line


        directionNumber =
            direction


        bus =
            busData


        const routeName =
            lineNumber +
            "_" +
            directionNumber


        const loaded =
            await loadRoute(
                routeName
            )


        if (!loaded) {

            loginError.textContent =
            "Nie znaleziono trasy " +
            routeName

            return
        }


        login.style.display =
        "none"


        buttons.style.display =
        "flex"


        loginError.textContent =
        ""


        updateInfo()

        draw()


    } catch(error) {

        console.error(error)


        loginError.textContent =
        "Błąd połączenia"
    }
}


async function changeDirection() {

    const newDirection =
        directionInput.value.trim()


    if (
        newDirection !== "1" &&
        newDirection !== "2"
    ) {

        directionError.textContent =
        "Wpisz 1 albo 2"

        return
    }


    const newRoute =
        lineNumber +
        "_" +
        newDirection


    directionError.textContent =
    "Ładowanie..."


    const loaded =
        await loadRoute(
            newRoute
        )


    if (!loaded) {

        directionError.textContent =
        "Nie znaleziono trasy " +
        newRoute

        return
    }


    directionNumber =
        newDirection


    directionMenu.style.display =
        "none"


    directionError.textContent =
        ""


    directionInput.value =
        ""


    updateInfo()

    draw()
}


async function changeVehicle() {

    const newFleet =
        vehicleInput.value.trim()


    if (!newFleet) {

        vehicleError.textContent =
        "Wpisz numer taborowy"

        return
    }


    vehicleError.textContent =
    "Łączenie..."


    try {

        const url =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/buses/" +
            encodeURIComponent(newFleet) +
            ".json"


        const response =
            await fetch(url)


        const data =
            await response.json()


        if (!data) {

            vehicleError.textContent =
            "Nie znaleziono pojazdu " +
            newFleet

            return
        }


        fleetNumber =
            newFleet


        bus =
            data


        vehicleMenu.style.display =
            "none"


        vehicleInput.value =
            ""


        vehicleError.textContent =
            ""


        updateInfo()

        draw()


    } catch(error) {

        console.error(error)


        vehicleError.textContent =
        "Błąd połączenia"
    }
}


async function loadBus() {

    if (
        !fleetNumber ||
        !selectedGameId
    ) {
        return
    }


    try {

        const url =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/buses/" +
            encodeURIComponent(fleetNumber) +
            ".json"


        const response =
            await fetch(url)


        const data =
            await response.json()


        if (!data) {

            statusElement.textContent =
            "Pojazd " +
            fleetNumber +
            " offline"

            return
        }


        bus =
            data


        updateInfo()

        draw()


    } catch(error) {

        console.error(error)
    }
}


function calculateRouteDistances() {

    routeDistances = [0]

    let total = 0


    for (
        let i = 1;
        i < route.length;
        i++
    ) {

        const dx =
            route[i].x -
            route[i - 1].x


        const dz =
            route[i].z -
            route[i - 1].z


        total +=
            Math.sqrt(
                dx * dx +
                dz * dz
            )


        routeDistances.push(
            total
        )
    }
}


function nearestRouteProgress(x,z) {

    if (route.length < 2) {
        return 0
    }


    let bestDistance =
        Infinity


    let bestProgress =
        0


    for (
        let i = 0;
        i < route.length - 1;
        i++
    ) {

        const a =
            route[i]


        const b =
            route[i + 1]


        const dx =
            b.x -
            a.x


        const dz =
            b.z -
            a.z


        const lengthSquared =
            dx * dx +
            dz * dz


        let t = 0


        if (lengthSquared > 0) {

            t =
                (
                    (x - a.x) * dx +
                    (z - a.z) * dz
                )
                /
                lengthSquared
        }


        t =
            Math.max(
                0,
                Math.min(
                    1,
                    t
                )
            )


        const px =
            a.x +
            dx * t


        const pz =
            a.z +
            dz * t


        const diffX =
            x - px


        const diffZ =
            z - pz


        const distanceSquared =
            diffX * diffX +
            diffZ * diffZ


        if (
            distanceSquared <
            bestDistance
        ) {

            bestDistance =
                distanceSquared


            const segmentLength =
                Math.sqrt(
                    lengthSquared
                )


            bestProgress =
                routeDistances[i] +
                segmentLength * t
        }
    }


    return bestProgress
}


function updateInfo() {

    if (
        fleetNumber &&
        lineNumber
    ) {

        const gameName =
            GAME_NAMES[selectedGameId]
            ||
            "Gra"


        statusElement.textContent =
            gameName +
            " • " +
            lineNumber +
            " • " +
            fleetNumber
    }


    routeNameElement.textContent =
        currentRouteName ||
        "---"


    updateNextStop()
}


function updateNextStop() {

    if (
        !bus ||
        route.length < 2 ||
        stops.length === 0
    ) {

        nextStopElement.textContent =
        "---"


        distanceElement.textContent =
        "---"


        return
    }


    const busProgress =
        nearestRouteProgress(
            bus.x,
            bus.z
        )


    let selectedStop =
        null


    let selectedProgress =
        0


    for (
        const stop
        of stops
    ) {

        const stopProgress =
            nearestRouteProgress(
                stop.x,
                stop.z
            )


        if (
            stopProgress >=
            busProgress - 5
        ) {

            selectedStop =
                stop


            selectedProgress =
                stopProgress


            break
        }
    }


    if (!selectedStop) {

        nextStopElement.textContent =
        "Koniec trasy"


        distanceElement.textContent =
        ""


        return
    }


    const distance =
        Math.max(
            0,
            selectedProgress -
            busProgress
        )


    nextStopElement.textContent =
        selectedStop.name ||
        "Przystanek"


    distanceElement.textContent =
        Math.round(distance) +
        " stud"
}


function calculateMap() {

    if (route.length < 2) {
        return
    }


    const width =
        window.innerWidth


    const height =
        window.innerHeight


    const padding =
        60


    const xs =
        route.map(
            p => p.x
        )


    const zs =
        route.map(
            p => p.z
        )


    const minX =
        Math.min(...xs)


    const maxX =
        Math.max(...xs)


    const minZ =
        Math.min(...zs)


    const maxZ =
        Math.max(...zs)


    const rangeX =
        maxX -
        minX || 1


    const rangeZ =
        maxZ -
        minZ || 1


    const scaleX =
        (
            width -
            padding * 2
        )
        /
        rangeX


    const scaleZ =
        (
            height -
            padding * 2
        )
        /
        rangeZ


    const scale =
        Math.min(
            scaleX,
            scaleZ
        )


    mapData = {

        minX,
        maxX,

        minZ,
        maxZ,

        scale
    }
}


function convert(x,z) {

    if (!mapData) {
        return null
    }


    const centerX =
        (
            mapData.minX +
            mapData.maxX
        ) / 2


    const centerZ =
        (
            mapData.minZ +
            mapData.maxZ
        ) / 2


    return {

        x:
            window.innerWidth / 2 +
            (
                x -
                centerX
            )
            *
            mapData.scale,


        y:
            window.innerHeight / 2 -
            (
                z -
                centerZ
            )
            *
            mapData.scale
    }
}


function drawRoute() {

    if (route.length < 2) {
        return
    }


    ctx.beginPath()


    route.forEach(
        (point,index) => {

            const p =
                convert(
                    point.x,
                    point.z
                )


            if (!p) {
                return
            }


            if (index === 0) {

                ctx.moveTo(
                    p.x,
                    p.y
                )

            } else {

                ctx.lineTo(
                    p.x,
                    p.y
                )
            }
        }
    )


    ctx.strokeStyle =
    "#00aaff"


    ctx.lineWidth =
    10


    ctx.lineCap =
    "round"


    ctx.lineJoin =
    "round"


    ctx.stroke()
}


function drawStops() {

    for (
        const stop
        of stops
    ) {

        const p =
            convert(
                stop.x,
                stop.z
            )


        if (!p) {
            continue
        }


        ctx.beginPath()


        ctx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI * 2
        )


        ctx.fillStyle =
        "#fff"


        ctx.fill()


        ctx.lineWidth =
        3


        ctx.strokeStyle =
        "#00aaff"


        ctx.stroke()
    }
}


function drawBus() {

    if (!bus) {
        return
    }


    const p =
        convert(
            bus.x,
            bus.z
        )


    if (!p) {
        return
    }


    ctx.save()


    ctx.translate(
        p.x,
        p.y
    )


    ctx.rotate(
        ((bus.rotation || 0) + 180) *
        Math.PI /
        180
    )


    ctx.beginPath()


    ctx.moveTo(
        0,
        -20
    )


    ctx.lineTo(
        -13,
        15
    )


    ctx.lineTo(
        0,
        10
    )


    ctx.lineTo(
        13,
        15
    )


    ctx.closePath()


    ctx.fillStyle =
    "#00ff66"


    ctx.fill()


    ctx.lineWidth =
    3


    ctx.strokeStyle =
    "#fff"


    ctx.stroke()


    ctx.restore()
}


function draw() {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    )


    ctx.fillStyle =
    "#000"


    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    )


    drawRoute()

    drawStops()

    drawBus()
}


function resize() {

    const ratio =
        window.devicePixelRatio || 1


    canvas.width =
        window.innerWidth *
        ratio


    canvas.height =
        window.innerHeight *
        ratio


    canvas.style.width =
        window.innerWidth +
        "px"


    canvas.style.height =
        window.innerHeight +
        "px"


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    )


    calculateMap()

    draw()
}


connectButton.addEventListener(
    "click",
    connect
)


fleetInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            lineInput.focus()
        }
    }
)


lineInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            directionNumberInput.focus()
        }
    }
)


directionNumberInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            connect()
        }
    }
)


changeDirectionButton.addEventListener(
    "click",
    () => {

        directionMenu.style.display =
        "flex"


        directionInput.value =
        directionNumber || ""


        directionError.textContent =
        ""


        directionInput.focus()
    }
)


confirmDirection.addEventListener(
    "click",
    changeDirection
)


directionInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            changeDirection()
        }
    }
)


cancelDirection.addEventListener(
    "click",
    () => {

        directionMenu.style.display =
        "none"


        directionError.textContent =
        ""
    }
)


changeBusButton.addEventListener(
    "click",
    () => {

        vehicleMenu.style.display =
        "flex"


        vehicleInput.value =
        fleetNumber || ""


        vehicleError.textContent =
        ""


        vehicleInput.focus()
    }
)


confirmVehicle.addEventListener(
    "click",
    changeVehicle
)


vehicleInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            changeVehicle()
        }
    }
)


cancelVehicle.addEventListener(
    "click",
    () => {

        vehicleMenu.style.display =
        "none"


        vehicleError.textContent =
        ""
    }
)


window.addEventListener(
    "resize",
    resize
)


resize()


setInterval(
    loadBus,
    500
)

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Nawigacja Roblox</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#status {
    position: fixed;
    top: 15px;
    left: 15px;
    background: rgba(20,20,20,0.92);
    color: white;
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 5;
}

#buttons {
    position: fixed;
    top: 15px;
    right: 15px;
    display: none;
    gap: 8px;
    z-index: 5;
}

.topButton {
    background: rgba(20,20,20,0.92);
    color: white;
    padding: 9px 13px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
}

#voiceButton.on {
    background: #0077aa;
}

#info {
    position: fixed;
    left: 15px;
    bottom: 20px;
    background: rgba(20,20,20,0.95);
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    min-width: 240px;
    z-index: 5;
}

#turnLabel,
#nextLabel {
    color: #888;
    font-size: 12px;
}

#turnInstruction {
    color: white;
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
    margin-bottom: 17px;
}

#nextStop {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

#distance {
    color: #00aaff;
    font-size: 17px;
    margin-top: 5px;
}

#routeName {
    color: #777;
    font-size: 12px;
    margin-top: 8px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.box {
    width: calc(100% - 60px);
    max-width: 350px;
    background: #111;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}

.box h2 {
    color: white;
    margin-top: 0;
}

.box p {
    color: #aaa;
}

.input {
    box-sizing: border-box;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    font-size: 20px;
    text-align: center;
    border-radius: 9px;
    border: 1px solid #444;
    background: #000;
    color: white;
    outline: none;
}

.input:focus {
    border-color: #00aaff;
}

select.input {
    appearance: none;
}

.mainButton {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 9px;
    background: #00aaff;
    color: white;
}

.cancelButton {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 9px;
    background: #333;
    color: white;
}

.error {
    color: #ff5555;
    margin-top: 12px;
    min-height: 20px;
}

#directionMenu,
#vehicleMenu {
    display: none;
}

@media (max-width: 600px) {

    #status {
        top: 5px;
        left: 5px;
        padding: 3px 5px;
        border-radius: 4px;
        font-size: 6px;
        max-width: 34vw;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #buttons {
        top: 5px;
        right: 5px;
        gap: 2px;
    }

    .topButton {
        padding: 3px 4px;
        border-radius: 4px;
        font-size: 6px;
    }

    #info {
        left: 5px;
        bottom: 5px;
        min-width: 0;
        width: 120px;
        max-width: 120px;
        padding: 4px 5px;
        border-radius: 5px;
    }

    #turnLabel,
    #nextLabel {
        font-size: 5px;
        line-height: 1;
    }

    #turnInstruction {
        font-size: 7px;
        line-height: 1;
        margin-top: 1px;
        margin-bottom: 4px;
    }

    #nextStop {
        font-size: 7px;
        line-height: 1;
        margin-top: 1px;
    }

    #distance {
        font-size: 7px;
        line-height: 1;
        margin-top: 1px;
    }

    #routeName {
        font-size: 5px;
        line-height: 1;
        margin-top: 2px;
    }
}
</style>
</head>

<script>

const DATABASE_URL =
"https://nawigacja-a8a91-default-rtdb.europe-west1.firebasedatabase.app"

const GAME_NAMES = {
    "10321306421": "MZK Garczyków",
    "10694470488": "Gra Testowa"
}

const STUD_TO_METERS = 0.25

const TURN_MIN_ANGLE = 30
const TURN_NOW_DISTANCE = 20
const TURN_FIRST_WARNING_DISTANCE = 200

const TURN_FINISH_DISTANCE_METERS = 10

const TURN_FINISH_DISTANCE_STUDS =
    TURN_FINISH_DISTANCE_METERS /
    STUD_TO_METERS

const WRONG_WAY_ANGLE = 105

const WRONG_WAY_MAX_ROUTE_DISTANCE = 200


const canvas =
document.getElementById("map")

const ctx =
canvas.getContext("2d")


const gameSelect =
document.getElementById("gameSelect")

const login =
document.getElementById("login")

const fleetInput =
document.getElementById("fleetNumber")

const lineInput =
document.getElementById("lineNumber")

const directionNumberInput =
document.getElementById("directionNumber")

const connectButton =
document.getElementById("connectButton")

const loginError =
document.getElementById("loginError")


const buttons =
document.getElementById("buttons")

const changeDirectionButton =
document.getElementById("changeDirectionButton")

const changeBusButton =
document.getElementById("changeBusButton")

const voiceButton =
document.getElementById("voiceButton")


const directionMenu =
document.getElementById("directionMenu")

const directionInput =
document.getElementById("directionInput")

const confirmDirection =
document.getElementById("confirmDirection")

const cancelDirection =
document.getElementById("cancelDirection")

const directionError =
document.getElementById("directionError")


const vehicleMenu =
document.getElementById("vehicleMenu")

const vehicleInput =
document.getElementById("vehicleInput")

const confirmVehicle =
document.getElementById("confirmVehicle")

const cancelVehicle =
document.getElementById("cancelVehicle")

const vehicleError =
document.getElementById("vehicleError")


const statusElement =
document.getElementById("status")

const turnInstructionElement =
document.getElementById("turnInstruction")

const nextStopElement =
document.getElementById("nextStop")

const distanceElement =
document.getElementById("distance")

const routeNameElement =
document.getElementById("routeName")


let selectedGameId = null
let fleetNumber = null
let lineNumber = null
let directionNumber = null
let currentRouteName = null

let route = []
let stops = []
let bus = null
let mapData = null
let routeDistances = []

let voiceEnabled = true

let activeTurnIndex = null
let currentTurnId = null

let announced200 = false
let announced100 = false
let announced50 = false
let announcedNow = false
let straightAnnounced = false
let wrongWayAnnounced = false


function normalizeArray(data) {

    if (!data) {
        return []
    }

    if (Array.isArray(data)) {
        return data
    }

    return Object.values(data)
}


function normalizeAngle(angle) {

    while (angle > 180) {
        angle -= 360
    }

    while (angle < -180) {
        angle += 360
    }

    return angle
}


function formatMeters(meters) {

    meters =
        Math.max(
            0,
            meters
        )

    if (meters >= 1000) {

        return (
            meters / 1000
        ).toFixed(1) + " km"
    }

    if (meters < 20) {

        return (
            Math.round(meters) +
            " m"
        )
    }

    return (
        Math.round(
            meters / 10
        ) *
        10
    ) + " m"
}


function speak(text) {

    if (!voiceEnabled) {
        return
    }

    if (!("speechSynthesis" in window)) {
        return
    }

    const message =
        new SpeechSynthesisUtterance(
            text
        )

    message.lang =
        "pl-PL"

    message.rate =
        1

    message.pitch =
        1

    message.volume =
        1

    window.speechSynthesis.speak(
        message
    )
}


function resetTurnAnnouncements() {

    announced200 = false
    announced100 = false
    announced50 = false
    announcedNow = false
}


function resetNavigationState() {

    activeTurnIndex = null
    currentTurnId = null

    straightAnnounced = false
    wrongWayAnnounced = false

    resetTurnAnnouncements()

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel()
    }
}


async function loadRoute(routeName) {

    try {

        const url =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/routes/" +
            encodeURIComponent(routeName) +
            ".json"

        const response =
            await fetch(url)

        const data =
            await response.json()

        if (
            !data ||
            !data.points
        ) {
            return false
        }

        route =
            normalizeArray(
                data.points
            )

        stops =
            normalizeArray(
                data.stops
            )

        route.sort(
            (a,b) =>
                Number(a.id) -
                Number(b.id)
        )

        stops.sort(
            (a,b) =>
                Number(a.id) -
                Number(b.id)
        )

        currentRouteName =
            routeName

        resetNavigationState()

        calculateRouteDistances()
        calculateMap()
        updateInfo()
        draw()

        return true

    } catch(error) {

        console.error(error)

        return false
    }
}


async function connect() {

    const gameId =
        gameSelect.value

    const fleet =
        fleetInput.value.trim()

    const line =
        lineInput.value.trim()

    const direction =
        directionNumberInput.value.trim()

    if (!fleet) {

        loginError.textContent =
            "Wpisz numer taborowy"

        return
    }

    if (!line) {

        loginError.textContent =
            "Wpisz linię"

        return
    }

    if (
        direction !== "1" &&
        direction !== "2"
    ) {

        loginError.textContent =
            "Kierunek musi być 1 albo 2"

        return
    }

    selectedGameId =
        gameId

    loginError.textContent =
        "Łączenie..."

    try {

        const busURL =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/buses/" +
            encodeURIComponent(fleet) +
            ".json"

        const busResponse =
            await fetch(busURL)

        const busData =
            await busResponse.json()

        if (!busData) {

            loginError.textContent =
                "Nie znaleziono pojazdu " +
                fleet

            return
        }

        fleetNumber = fleet
        lineNumber = line
        directionNumber = direction
        bus = busData

        const routeName =
            lineNumber +
            "_" +
            directionNumber

        const loaded =
            await loadRoute(
                routeName
            )

        if (!loaded) {

            loginError.textContent =
                "Nie znaleziono trasy " +
                routeName

            return
        }

        login.style.display =
            "none"

        buttons.style.display =
            "flex"

        loginError.textContent =
            ""

        updateInfo()
        draw()

    } catch(error) {

        console.error(error)

        loginError.textContent =
            "Błąd połączenia"
    }
}


async function changeDirection() {

    const newDirection =
        directionInput.value.trim()

    if (
        newDirection !== "1" &&
        newDirection !== "2"
    ) {

        directionError.textContent =
            "Wpisz 1 albo 2"

        return
    }

    const newRoute =
        lineNumber +
        "_" +
        newDirection

    directionError.textContent =
        "Ładowanie..."

    const loaded =
        await loadRoute(
            newRoute
        )

    if (!loaded) {

        directionError.textContent =
            "Nie znaleziono trasy " +
            newRoute

        return
    }

    directionNumber =
        newDirection

    directionMenu.style.display =
        "none"

    directionInput.value =
        ""

    directionError.textContent =
        ""

    updateInfo()
    draw()
}


async function changeVehicle() {

    const newFleet =
        vehicleInput.value.trim()

    if (!newFleet) {

        vehicleError.textContent =
            "Wpisz numer taborowy"

        return
    }

    vehicleError.textContent =
        "Łączenie..."

    try {

        const url =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/buses/" +
            encodeURIComponent(newFleet) +
            ".json"

        const response =
            await fetch(url)

        const data =
            await response.json()

        if (!data) {

            vehicleError.textContent =
                "Nie znaleziono pojazdu " +
                newFleet

            return
        }

        fleetNumber =
            newFleet

        bus =
            data

        resetNavigationState()

        vehicleMenu.style.display =
            "none"

        vehicleInput.value =
            ""

        vehicleError.textContent =
            ""

        updateInfo()
        draw()

    } catch(error) {

        console.error(error)

        vehicleError.textContent =
            "Błąd połączenia"
    }
}


async function loadBus() {

    if (
        !fleetNumber ||
        !selectedGameId
    ) {
        return
    }

    try {

        const url =
            DATABASE_URL +
            "/games/" +
            encodeURIComponent(selectedGameId) +
            "/buses/" +
            encodeURIComponent(fleetNumber) +
            ".json"

        const response =
            await fetch(url)

        const data =
            await response.json()

        if (!data) {

            statusElement.textContent =
                "Pojazd " +
                fleetNumber +
                " offline"

            return
        }

        bus =
            data

        updateInfo()
        draw()

    } catch(error) {

        console.error(error)
    }
}


function calculateRouteDistances() {

    routeDistances =
        [0]

    let total =
        0

    for (
        let i = 1;
        i < route.length;
        i++
    ) {

        const dx =
            route[i].x -
            route[i - 1].x

        const dz =
            route[i].z -
            route[i - 1].z

        total +=
            Math.sqrt(
                dx * dx +
                dz * dz
            )

        routeDistances.push(
            total
        )
    }
}


function nearestRouteInfo(x,z) {

    if (
        route.length < 2
    ) {
        return null
    }

    let bestDistanceSquared =
        Infinity

    let bestProgress =
        0

    let bestSegment =
        0

    let bestT =
        0

    for (
        let i = 0;
        i < route.length - 1;
        i++
    ) {

        const a =
            route[i]

        const b =
            route[i + 1]

        const dx =
            b.x -
            a.x

        const dz =
            b.z -
            a.z

        const lengthSquared =
            dx * dx +
            dz * dz

        let t =
            0

        if (
            lengthSquared > 0
        ) {

            t =
                (
                    (x - a.x) * dx +
                    (z - a.z) * dz
                )
                /
                lengthSquared
        }

        t =
            Math.max(
                0,
                Math.min(
                    1,
                    t
                )
            )

        const px =
            a.x +
            dx * t

        const pz =
            a.z +
            dz * t

        const diffX =
            x -
            px

        const diffZ =
            z -
            pz

        const distanceSquared =
            diffX * diffX +
            diffZ * diffZ

        if (
            distanceSquared <
            bestDistanceSquared
        ) {

            bestDistanceSquared =
                distanceSquared

            bestSegment =
                i

            bestT =
                t

            const segmentLength =
                Math.sqrt(
                    lengthSquared
                )

            bestProgress =
                routeDistances[i] +
                segmentLength * t
        }
    }

    return {

        progress:
            bestProgress,

        segment:
            bestSegment,

        t:
            bestT,

        distance:
            Math.sqrt(
                bestDistanceSquared
            )
    }
}


function nearestRouteProgress(x,z) {

    const info =
        nearestRouteInfo(
            x,
            z
        )

    if (!info) {
        return 0
    }

    return info.progress
}


function isWrongWay() {

    if (
        !bus ||
        route.length < 2
    ) {
        return false
    }

    const info =
        nearestRouteInfo(
            bus.x,
            bus.z
        )

    if (!info) {
        return false
    }

    if (
        info.distance >
        WRONG_WAY_MAX_ROUTE_DISTANCE
    ) {
        return false
    }

    const a =
        route[
            info.segment
        ]

    const b =
        route[
            info.segment + 1
        ]

    if (
        !a ||
        !b
    ) {
        return false
    }

    const dx =
        b.x -
        a.x

    const dz =
        b.z -
        a.z

    const routeRotation =
        Math.atan2(
            -dx,
            -dz
        )
        *
        180 /
        Math.PI

    const busRotation =
        Number(
            bus.rotation ||
            0
        )

    const difference =
        Math.abs(
            normalizeAngle(
                busRotation -
                routeRotation
            )
        )

    return (
        difference >=
        WRONG_WAY_ANGLE
    )
}


function calculateTurn(
    previous,
    current,
    next
) {

    const incomingX =
        current.x -
        previous.x

    const incomingZ =
        current.z -
        previous.z

    const outgoingX =
        next.x -
        current.x

    const outgoingZ =
        next.z -
        current.z

    const incomingLength =
        Math.sqrt(
            incomingX * incomingX +
            incomingZ * incomingZ
        )

    const outgoingLength =
        Math.sqrt(
            outgoingX * outgoingX +
            outgoingZ * outgoingZ
        )

    if (
        incomingLength < 0.1 ||
        outgoingLength < 0.1
    ) {
        return null
    }

    const dot =
        incomingX *
        outgoingX +
        incomingZ *
        outgoingZ

    const cross =
        incomingX *
        outgoingZ -
        incomingZ *
        outgoingX

    const angle =
        Math.atan2(
            Math.abs(cross),
            dot
        )
        *
        180 /
        Math.PI

    if (
        angle <
        TURN_MIN_ANGLE
    ) {
        return null
    }

    return {

        direction:
            cross > 0
            ? "right"
            : "left",

        angle:
            angle
    }
}


function getTurnByIndex(
    index,
    busProgress
) {

    if (
        index <= 0 ||
        index >=
        route.length - 1
    ) {
        return null
    }

    const turn =
        calculateTurn(
            route[index - 1],
            route[index],
            route[index + 1]
        )

    if (!turn) {
        return null
    }

    const turnProgress =
        routeDistances[
            index
        ]

    const rawDistanceStuds =
        turnProgress -
        busProgress

    const distanceStuds =
        Math.max(
            0,
            rawDistanceStuds
        )

    return {

        index:
            index,

        progress:
            turnProgress,

        passed:
            rawDistanceStuds < 0,

        direction:
            turn.direction,

        angle:
            turn.angle,

        distance:
            distanceStuds *
            STUD_TO_METERS
    }
}


function findNextTurn() {

    if (
        !bus ||
        route.length < 3
    ) {
        return null
    }

    const busProgress =
        nearestRouteProgress(
            bus.x,
            bus.z
        )

    if (
        activeTurnIndex !== null
    ) {

        const turnProgress =
            routeDistances[
                activeTurnIndex
            ]

        const finishProgress =
            turnProgress +
            TURN_FINISH_DISTANCE_STUDS

        if (
            busProgress <=
            finishProgress
        ) {

            const activeTurn =
                getTurnByIndex(
                    activeTurnIndex,
                    busProgress
                )

            if (activeTurn) {
                return activeTurn
            }

        } else {

            activeTurnIndex =
                null

            currentTurnId =
                null

            resetTurnAnnouncements()

            straightAnnounced =
                false
        }
    }

    for (
        let i = 1;
        i < route.length - 1;
        i++
    ) {

        const turnProgress =
            routeDistances[i]

        if (
            turnProgress <
            busProgress
        ) {
            continue
        }

        const turn =
            getTurnByIndex(
                i,
                busProgress
            )

        if (!turn) {
            continue
        }

        activeTurnIndex =
            i

        return turn
    }

    return null
}


function announceStraight() {

    if (
        straightAnnounced
    ) {
        return
    }

    speak(
        "Jedź prosto"
    )

    straightAnnounced =
        true
}


function handleVoiceNavigation(
    turn,
    wrongWay
) {

    if (wrongWay) {

        straightAnnounced =
            false

        if (
            !wrongWayAnnounced
        ) {

            if (
                "speechSynthesis"
                in window
            ) {
                window
                    .speechSynthesis
                    .cancel()
            }

            speak(
                "Zawróć"
            )

            wrongWayAnnounced =
                true
        }

        return
    }

    wrongWayAnnounced =
        false

    if (!turn) {

        currentTurnId =
            null

        resetTurnAnnouncements()

        announceStraight()

        return
    }

    if (
        turn.passed
    ) {
        return
    }

    if (
        turn.distance >
        TURN_FIRST_WARNING_DISTANCE
    ) {

        announceStraight()

        return
    }

    straightAnnounced =
        false

    const turnId =
        turn.index +
        "_" +
        turn.direction

    if (
        turnId !==
        currentTurnId
    ) {

        currentTurnId =
            turnId

        resetTurnAnnouncements()
    }

    const directionText =
        turn.direction ===
        "right"
        ? "w prawo"
        : "w lewo"

    if (
        turn.distance <= 200 &&
        turn.distance > 100 &&
        !announced200
    ) {

        speak(
            "Za 200 metrów skręć " +
            directionText
        )

        announced200 =
            true
    }

    if (
        turn.distance <= 100 &&
        turn.distance > 50 &&
        !announced100
    ) {

        speak(
            "Za 100 metrów skręć " +
            directionText
        )

        announced100 =
            true
    }

    if (
        turn.distance <= 50 &&
        turn.distance >
        TURN_NOW_DISTANCE &&
        !announced50
    ) {

        speak(
            "Za 50 metrów skręć " +
            directionText
        )

        announced50 =
            true
    }

    if (
        turn.distance <=
        TURN_NOW_DISTANCE &&
        !announcedNow
    ) {

        if (
            "speechSynthesis"
                in window
        ) {

            window
                .speechSynthesis
                .cancel()
        }

        speak(
            "Skręć " +
            directionText
        )

        announcedNow =
            true
    }
}


function updateNavigationInstruction() {

    const wrongWay =
        isWrongWay()

    if (wrongWay) {

        turnInstructionElement.textContent =
            "Zawróć"

        turnInstructionElement.style.color =
            "#ff3b3b"

        handleVoiceNavigation(
            null,
            true
        )

        return
    }

    turnInstructionElement.style.color =
        "#ffffff"

    const turn =
        findNextTurn()

    handleVoiceNavigation(
        turn,
        false
    )

    if (!turn) {

        turnInstructionElement.textContent =
            "Jedź prosto"

        return
    }

    if (
        turn.passed
    ) {

        turnInstructionElement.textContent =
            turn.direction === "right"
            ? "Skręć w prawo"
            : "Skręć w lewo"

        return
    }

    if (
        turn.distance >
        TURN_FIRST_WARNING_DISTANCE
    ) {

        turnInstructionElement.textContent =
            "Jedź prosto"

        return
    }

    const directionText =
        turn.direction === "right"
        ? "skręć w prawo"
        : "skręć w lewo"

    if (
        turn.distance <=
        TURN_NOW_DISTANCE
    ) {

        turnInstructionElement.textContent =
            directionText
                .charAt(0)
                .toUpperCase()
            +
            directionText.slice(1)

        return
    }

    turnInstructionElement.textContent =
        "Za " +
        formatMeters(
            turn.distance
        ) +
        " " +
        directionText
}


function updateNextStop() {

    if (
        !bus ||
        route.length < 2 ||
        stops.length === 0
    ) {

        nextStopElement.textContent =
            "---"

        distanceElement.textContent =
            "---"

        return
    }

    const busProgress =
        nearestRouteProgress(
            bus.x,
            bus.z
        )

    let selectedStop =
        null

    let selectedProgress =
        0

    for (
        const stop
        of stops
    ) {

        const stopProgress =
            nearestRouteProgress(
                stop.x,
                stop.z
            )

        if (
            stopProgress >=
            busProgress - 5
        ) {

            selectedStop =
                stop

            selectedProgress =
                stopProgress

            break
        }
    }

    if (
        !selectedStop
    ) {

        nextStopElement.textContent =
            "Koniec trasy"

        distanceElement.textContent =
            ""

        return
    }

    const distanceStuds =
        Math.max(
            0,
            selectedProgress -
            busProgress
        )

    const distanceMeters =
        distanceStuds *
        STUD_TO_METERS

    nextStopElement.textContent =
        selectedStop.name ||
        "Przystanek"

    distanceElement.textContent =
        formatMeters(
            distanceMeters
        )
}


function updateInfo() {

    if (
        fleetNumber &&
        lineNumber
    ) {

        const gameName =
            GAME_NAMES[
                selectedGameId
            ]
            ||
            "Gra"

        statusElement.textContent =
            gameName +
            " • " +
            lineNumber +
            " • " +
            fleetNumber
    }

    routeNameElement.textContent =
        currentRouteName ||
        "---"

    updateNavigationInstruction()

    updateNextStop()
}


function calculateMap() {

    if (
        route.length < 2
    ) {
        return
    }

    const padding =
        60

    const xs =
        route.map(
            p => p.x
        )

    const zs =
        route.map(
            p => p.z
        )

    const minX =
        Math.min(...xs)

    const maxX =
        Math.max(...xs)

    const minZ =
        Math.min(...zs)

    const maxZ =
        Math.max(...zs)

    const rangeX =
        maxX -
        minX ||
        1

    const rangeZ =
        maxZ -
        minZ ||
        1

    const scaleX =
        (
            window.innerWidth -
            padding * 2
        )
        /
        rangeX

    const scaleZ =
        (
            window.innerHeight -
            padding * 2
        )
        /
        rangeZ

    mapData = {

        minX:
            minX,

        maxX:
            maxX,

        minZ:
            minZ,

        maxZ:
            maxZ,

        scale:
            Math.min(
                scaleX,
                scaleZ
            )
    }
}


function convert(x,z) {

    if (!mapData) {
        return null
    }

    const centerX =
        (
            mapData.minX +
            mapData.maxX
        )
        /
        2

    const centerZ =
        (
            mapData.minZ +
            mapData.maxZ
        )
        /
        2

    return {

        x:
            window.innerWidth /
            2 +
            (
                x -
                centerX
            )
            *
            mapData.scale,

        y:
            window.innerHeight /
            2 -
            (
                z -
                centerZ
            )
            *
            mapData.scale
    }
}


function drawRoute() {

    if (
        route.length < 2
    ) {
        return
    }

    ctx.beginPath()

    route.forEach(
        (point,index) => {

            const p =
                convert(
                    point.x,
                    point.z
                )

            if (!p) {
                return
            }

            if (
                index === 0
            ) {

                ctx.moveTo(
                    p.x,
                    p.y
                )

            } else {

                ctx.lineTo(
                    p.x,
                    p.y
                )
            }
        }
    )

    ctx.strokeStyle =
        "#00aaff"

    ctx.lineWidth =
        10

    ctx.lineCap =
        "round"

    ctx.lineJoin =
        "round"

    ctx.stroke()
}


function drawStops() {

    for (
        const stop
        of stops
    ) {

        const p =
            convert(
                stop.x,
                stop.z
            )

        if (!p) {
            continue
        }

        ctx.beginPath()

        ctx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI * 2
        )

        ctx.fillStyle =
            "#fff"

        ctx.fill()

        ctx.lineWidth =
            3

        ctx.strokeStyle =
            "#00aaff"

        ctx.stroke()
    }
}


function drawBus() {

    if (!bus) {
        return
    }

    const p =
        convert(
            bus.x,
            bus.z
        )

    if (!p) {
        return
    }

    ctx.save()

    ctx.translate(
        p.x,
        p.y
    )

    ctx.rotate(
        (
            (bus.rotation || 0) +
            180
        )
        *
        Math.PI /
        180
    )

    ctx.beginPath()

    ctx.moveTo(
        0,
        -20
    )

    ctx.lineTo(
        -13,
        15
    )

    ctx.lineTo(
        0,
        10
    )

    ctx.lineTo(
        13,
        15
    )

    ctx.closePath()

    ctx.fillStyle =
        "#00ff66"

    ctx.fill()

    ctx.lineWidth =
        3

    ctx.strokeStyle =
        "#fff"

    ctx.stroke()

    ctx.restore()
}


function draw() {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    )

    ctx.fillStyle =
        "#000"

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    )

    drawRoute()
    drawStops()
    drawBus()
}


function resize() {

    const ratio =
        window.devicePixelRatio ||
        1

    canvas.width =
        window.innerWidth *
        ratio

    canvas.height =
        window.innerHeight *
        ratio

    canvas.style.width =
        window.innerWidth +
        "px"

    canvas.style.height =
        window.innerHeight +
        "px"

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    )

    calculateMap()

    draw()
}


voiceButton.addEventListener(
    "click",
    () => {

        voiceEnabled =
            !voiceEnabled

        if (
            voiceEnabled
        ) {

            voiceButton.textContent =
                "Głos: ON"

            voiceButton
                .classList
                .add(
                    "on"
                )

            speak(
                "Komunikaty głosowe włączone"
            )

        } else {

            voiceButton.textContent =
                "Głos: OFF"

            voiceButton
                .classList
                .remove(
                    "on"
                )

            if (
                "speechSynthesis"
                in window
            ) {

                window
                    .speechSynthesis
                    .cancel()
            }
        }
    }
)


connectButton.addEventListener(

)


fleetInput.addEventListener(

        if (
            event.key ===

        ) {

)


lineInput.addEventListener(

        if (
            event.key ===

        ) {

        }
    }
)


directionNumberInput.addEventListener(

        if (

        }

)


changeDirectionButton.addEventListener(

        directionError.textContent =

)


confirmDirection.addEventListener(

)


directionInput.addEventListener(

        if (
            event.key ===

)


cancelDirection.addEventListener(

        directionMenu.style.display =

changeBusButton.addEventListener(

        vehicleInput.value =

        vehicleError.textContent =
            ""

        vehicleInput.focus()
    }
)


confirmVehicle.addEventListener(
    "click",
    changeVehicle
)


vehicleInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            changeVehicle()
        }
    }
)


cancelVehicle.addEventListener(
    "click",
    () => {

        vehicleMenu.style.display =
            "none"

        vehicleError.textContent =
            ""
    }
)


window.addEventListener(
    "resize",
    resize
)


resize()


setInterval(
    loadBus,
    500
)
